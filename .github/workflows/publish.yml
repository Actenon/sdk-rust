name: Publish to crates.io

# Publishes actenon-verifier-sdk to crates.io.
#
# Triggers on:
#   - Tag pushes matching v* (e.g. v0.1.0)
#   - Manual workflow_dispatch
#
# Requires the CARGO_REGISTRY_TOKEN secret to be set in the repo's
# Actions secrets. The token must have publish rights on crates.io.
# Create one at: https://crates.io/settings/tokens

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  publish:
    name: Publish to crates.io
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Run tests
        run: cargo test --all

      - name: Dry-run publish (verify package is publishable)
        run: cargo publish --dry-run --allow-dirty

      - name: Publish to crates.io
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish --allow-dirty --token "$CARGO_REGISTRY_TOKEN"

      - name: Verify publication
        run: |
          sleep 5
          VERSION=$(grep '^version' Cargo.toml | head -1 | sed 's/.*"\(.*\)"/\1/')
          echo "Published actenon-verifier-sdk@$VERSION"
          echo "View at: https://crates.io/crates/actenon-verifier-sdk/$VERSION"
